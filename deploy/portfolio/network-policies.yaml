apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [frontend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [loadgenerator]
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-apis
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [userservice, contacts, balancereader, ledgerwriter, transactionhistory]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [frontend, userservice, contacts, balancereader, ledgerwriter, transactionhistory]
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-accounts-db
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [accounts-db]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [contacts, userservice]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ledger-db
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [ledger-db]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [balancereader, ledgerwriter, transactionhistory]
      ports:
        - protocol: TCP
          port: 5432
