apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ledger-lab
resources:
  - ../../kubernetes-manifests
  - network-policies.yaml
patches:
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
  - target:
      kind: ServiceAccount
      name: bank-of-anthos
    patch: |-
      - op: remove
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
  - target:
      kind: Deployment|StatefulSet
      name: .*
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |-
      - op: add
        path: /spec/replicas
        value: 0
  - path: cloud-telemetry.yaml
